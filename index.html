    <script>
      window.__kspDeferredPrompt = null;
      window.__kspPwaInstalled = false;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__kspDeferredPrompt = e;
        window.dispatchEvent(new Event('ksp-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__kspDeferredPrompt = null;
        window.__kspPwaInstalled = true;
        window.dispatchEvent(new Event('ksp-pwa-installed'));
      });
    </script>
